# TechLab Fisio — CI (docs/08 §13 `E-13` + `E-15`).
#
# A partir da E-15, a RECONSTRUÇÃO FROM-SCRATCH é a própria preparação da
# suíte: `scripts/verify-from-scratch.mjs` sobe uma instância PostgreSQL 18
# LIMPA (container + volume descartáveis, mesmo `postgres:18-bookworm` e mesmo
# bootstrap initdb versionados do projeto), reconstrói o schema EXCLUSIVAMENTE
# por `prisma migrate deploy`, verifica no catálogo os objetos das Categorias
# B/C, executa a suíte INTEGRAL de integração (banco descartável; migrations
# como tlf_migrator; testes como tlf_app — infraestrutura E-13 inalterada) e
# destrói os recursos descartáveis. Nenhuma verificação da E-13 foi reduzida —
# a mesma suíte roda, agora a partir do zero absoluto.
#
# NÃO é a E-16: nenhum golden schema, lint de migration, teste negativo de
# guarda ou `migrate diff` — a tríade anti-drift/V-04 pertence à etapa própria.
#
# Credenciais: exclusivamente as sintéticas de `.env.example`. Nenhum segredo.

name: ci

on:
  push:
    branches: ["agent/**"]
  workflow_dispatch:

jobs:
  integracao:
    name: E-15 — reconstrução from-scratch + suíte de integração (Jest 30 + PostgreSQL 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Fonte única da versão de Node (docs/08 §4.4): linha 24.x.
          node-version-file: .nvmrc
          cache: npm

      - name: Ambiente sintético (.env a partir do modelo versionado)
        run: cp .env.example .env

      - name: Instalação reproduzível pelo lockfile
        run: npm ci

      - name: Prisma Client
        run: npx prisma generate

      - name: Typecheck (inclui os testes — tsconfig.test.json)
        run: npm run typecheck

      - name: E-15 — PostgreSQL 18 limpo → migrate deploy → catálogo → suíte integral → limpeza
        run: npm run verify:from-scratch
