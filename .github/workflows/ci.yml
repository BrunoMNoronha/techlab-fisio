# TechLab Fisio — CI (docs/08 §13 `E-13` + `E-15` + `E-16`).
#
# A partir da E-16, o job executa PERMANENTEMENTE a tríade anti-drift de
# docs/08 §9.3, na ordem barato → caro:
#
#   1. instalação reproduzível (lockfile) + Prisma generate/validate + typecheck;
#   2. GUARDA 1 — lint de migrations sobre a lista única de objetos protegidos
#      (packages/database/protected-objects.json) — análise de arquivos, sem SQL;
#   3. E-15 — reconstrução from-scratch (instância PostgreSQL 18 limpa +
#      `prisma migrate deploy` + catálogo B/C) que É a preparação da suíte
#      integral de integração — a suíte inclui a GUARDA 2
#      (test/guard-anti-drift.spec.ts: existência E efeito de todos os
#      objetos protegidos, inclusive os REVOKEs que o golden não cobre);
#   4. GUARDA 3 — golden schema: nova reconstrução limpa independente,
#      `pg_dump --schema-only --no-owner --no-privileges --restrict-key=<fixa>`
#      DENTRO do container, comparação BYTE A BYTE com o golden versionado
#      (o CI NUNCA atualiza o golden; divergência => falha) + ALARME
#      complementar `prisma migrate diff --from-migrations ... --to-schema ...
#      --exit-code` (exit 2 = drift => falha).
#
# Nenhuma verificação da E-13/E-15 foi reduzida; a suíte roda UMA vez (dentro
# da reconstrução from-scratch).
#
# Credenciais: exclusivamente as sintéticas de `.env.example`. Nenhum segredo.

name: ci

on:
  push:
    branches: ["agent/**"]
  workflow_dispatch:

jobs:
  integracao:
    name: E-16 — tríade anti-drift + reconstrução from-scratch + suíte integral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Fonte única da versão de Node (docs/08 §4.4): linha 24.x.
          node-version-file: .nvmrc
          cache: npm

      - name: Ambiente sintético (.env a partir do modelo versionado)
        run: cp .env.example .env

      - name: Instalação reproduzível pelo lockfile
        run: npm ci

      - name: Prisma Client + validação do schema
        run: |
          npx prisma generate
          npx prisma validate

      - name: Typecheck (inclui os testes — tsconfig.test.json)
        run: npm run typecheck

      - name: "Guarda 1 — lint de migrations (objetos protegidos)"
        run: npm run lint:migrations

      - name: "E-15 + Guarda 2 — PostgreSQL 18 limpo → migrate deploy → catálogo → suíte integral → limpeza"
        run: npm run verify:from-scratch

      - name: "Guarda 3 + alarme — golden schema byte a byte + prisma migrate diff --exit-code"
        run: npm run schema:verify

      # ------------------------------------------------------------------
      # Etapa 2.3A — fundação do backend (apps/api). Passos ACRESCENTADOS;
      # nenhuma guarda de persistência acima foi alterada ou reordenada.
      # ------------------------------------------------------------------

      # FRONT-F0 (05/09/2026): `npm run build` passou a incluir apps/web
      # (`next build`, que também executa a verificação de tipos do Next).
      # Somente o NOME deste passo mudou; nenhuma guarda anterior foi alterada.
      - name: "Build dos workspaces (packages/database → apps/api → apps/web)"
        run: npm run build

      # Etapa 2.3D-B / F1 (achado A-04 da revisão independente): prova de
      # runtime do addon NATIVO do `argon2` no ESM compilado, FORA do Jest.
      # Posicionada no PRIMEIRO ponto em que `apps/api/dist/**` existe — a
      # prova é barata (<1 s) e falha cedo, na ordem barato → caro do job.
      # Nenhuma etapa anterior foi movida ou alterada.
      # Fecha a lacuna de uma biblioteca nativa funcionar sob o runtime de VM
      # do Jest e falhar em `node dist/main.js`, e é o único passo que valida
      # o prebuild N-API de linux-x64 de forma explícita.
      - name: "Backend — prova de runtime do Argon2id no ESM compilado (D-2.3D-02)"
        run: npm run verify:argon2-runtime --workspace @techlab-fisio/api

      # Etapa 2.3D-B / F3 (`D-2.3D-11`, `P-2.3D-03`): prova de runtime do
      # `@nestjs/swagger@11.4.7` sobre o ESM compilado, FORA do Jest — a
      # compatibilidade com ESM/`nodenext` é MEDIDA, nunca assumida. Cobre
      # também a construção do documento a partir do `AppModule` compilado, a
      # ausência de campo secreto no contrato, a montagem da rota por ambiente
      # e o cookie seguro de `R-2.3D-04` no artefato real. Mesma posição e
      # mesma razão da prova do Argon2: barata, no primeiro ponto em que
      # `apps/api/dist/**` existe, e falha cedo.
      - name: "Backend — prova de runtime do OpenAPI no ESM compilado (D-2.3D-11)"
        run: npm run verify:openapi-runtime --workspace @techlab-fisio/api

      - name: "Backend — suíte de apps/api (bootstrap, health, integração database, T-AUD-CONTEXTO)"
        run: npm run test:api

      # F-01 (revisão da 2.3A; caminho ATUALIZADO na 2.3B): prova runtime,
      # FORA do Jest, de que o Node ESM resolve `@techlab-fisio/database` pelo
      # `exports.default` do pacote (dist/src/index.js — o build da 2.3B passou
      # a compilar também o Prisma Client gerado, e o rootDir do pacote virou a
      # raiz). O Jest não serve como prova deste caminho porque mapeia o pacote
      # para src/index.ts. A prova também cobre a fábrica pública da 2.3B.
      - name: "Backend — prova runtime do exports público de @techlab-fisio/database (F-01)"
        run: |
          node --input-type=module -e '
            const m = await import("@techlab-fisio/database");
            if (typeof m.identificarViolacao !== "function") {
              throw new Error("exports.default resolveu, mas nao expos identificarViolacao");
            }
            if (typeof m.criarClientePersistencia !== "function") {
              throw new Error("exports.default resolveu, mas nao expos criarClientePersistencia");
            }
            console.log("exports.default -> dist/src/index.js OK:", Object.keys(m).sort().join(", "));
          '

      # ------------------------------------------------------------------
      # Etapa 2.3B — provider de persistência + primeiro fluxo transacional
      # de auditoria. Passos ACRESCENTADOS; nenhuma guarda anterior alterada.
      # ------------------------------------------------------------------

      # Integração real da API: AppModule → DatabaseService → fábrica pública
      # → tlf_app → PostgreSQL 18 descartável → profissional →
      # AuditContextValidator → evento_auditoria (atomicidade, rollback,
      # concorrência, postura de role — tlf_app aceito, migrator rejeitado).
      - name: "Backend — integração da API com PostgreSQL 18 real (tlf_app + fluxo auditado)"
        run: npm run verify:api-integration

      # R-BL-02 (2.3A) ADAPTADO na 2.3B: o DatabaseService conecta EAGER no
      # bootstrap, então o smoke provisiona banco descartável (tlf_app) antes
      # de executar o processo real. Preserva TODAS as verificações da 2.3A:
      # processo real dist/main.js, /health 200, 404 sem stack, encerramento
      # limpo por SIGTERM e cleanup garantido mesmo em falha (F-03).
      - name: "Backend — prova de bootstrap ESM (R-BL-02): dist/main.js + banco descartável"
        run: npm run smoke:api
